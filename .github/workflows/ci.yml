name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release this commit as v<version> (for example 0.5.0)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  dotnet:
    uses: remonenaidoo/swiftbets-platform/.github/workflows/dotnet.yml@main
    permissions:
      contents: read
      packages: write
      security-events: write

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: dotnet
    uses: remonenaidoo/swiftbets-platform/.github/workflows/dotnet-release.yml@main
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: write
